<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Student</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
</head>
<body>

{% include 'navbar.html' %}

<div class="container">
    <h2 class="page-title">Edit Student</h2>

    <div class="card">
        <form action="/update/{{ student.student_id }}" method="POST"
              class="form-grid edit-form">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" value="{{ student.name }}" required>
            </div>

            <div class="form-group">
                <label>Date of Birth</label>
                <input type="date" name="dob" value="{{ student.dob }}" required>
            </div>

            <div class="form-group">
                <label>Gender</label>
                <select name="gender" required>
                    <option value="Male" {% if student.gender == 'Male' %}selected{% endif %}>Male</option>
                    <option value="Female" {% if student.gender == 'Female' %}selected{% endif %}>Female</option>
                </select>
            </div>

            <div class="form-group">
                <label>Contact</label>
                <input type="text" name="contact" value="{{ student.contact }}" required>
            </div>

            <div class="form-group">
                <label>Course</label>
                <select name="course_id" required>
                    {% for c in courses %}
                    <option value="{{ c.course_id }}"
                        {% if c.course_id == student.course_id %}selected{% endif %}>
                        {{ c.course_name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Buttons -->
            <div class="form-group">
                <label>&nbsp;</label>

                <div class="actions">
                    <button type="submit" class="btn btn-primary">
                        Update
                    </button>

                    <a href="/" class="btn btn-edit">Cancel</a>
                </div>
            </div>

        </form>
    </div>
</div>

{% include 'footer.html' %}

</body>
</html>
